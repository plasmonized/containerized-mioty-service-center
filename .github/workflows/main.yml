name: Python CI

on:
  push:
    branches: [ "main", "release" ]
  pull_request:
    branches: [ "main", "release" ]

jobs:
  lint-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy pytest

    - name: Run flake8 (Style & Fehler) - Relaxed
      run: |
        flake8 . \
          --max-line-length=120 \
          --ignore=E501,F541,E302,E303,W293,F401,F811,E722,E261,E128,W503,E111,E117,W504,E305,F824,E129,W291,W292,E203 \
          --exclude=.pythonlibs,./attached_assets \
          || echo "flake8 completed with warnings"

    - name: Run pytest (Tests)  
      run: pytest || echo "No tests found - OK"

  docker-pr:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/release')
    needs: lint-test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}/pr-test
        labels: |
          com.bssci.pr.id=${{ github.event.pull_request.number }}
          com.bssci.pr.branch=${{ github.head_ref }}
          com.bssci.pr.commit=${{ github.sha }}

    - name: Build PR Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.pr
        push: false
        load: true
        tags: ghcr.io/${{ github.repository }}/pr-test:pr-${{ github.event.pull_request.number }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          GITHUB_PR_ID=${{ github.event.pull_request.number }}
          GITHUB_SHA=${{ github.sha }}
          GITHUB_HEAD_REF=${{ github.head_ref }}

    - name: Run container
      run: |
        docker run -d --name bssci-pr-test \
          -p 16019:16018 -p 5056:5000 \
          ghcr.io/${{ github.repository.toLowerCase() }}/pr-test:pr-${{ github.event.pull_request.number }}
        sleep 5
        docker logs bssci-pr-test
        docker stop bssci-pr-test || true

    - name: Cleanup
      if: always()
      run: docker stop bssci-pr-test || true
