name: Python CI

on:
  push:
    branches: [ "main", "release", "feature/*" ]
    paths-ignore:
      - 'docs/**'
      - '.vitepress/**'
  pull_request:
    branches: [ "main", "release" ]

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups || uv sync --all-groups
      - run: uv run ruff check . --exclude=attached_assets
      - run: uv run ruff format --check . --exclude=attached_assets

  type-check:
    name: Type Check (Mypy)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups || uv sync --all-groups
      - run: uv run mypy . --ignore-missing-imports --exclude=attached_assets

  test:
    name: Tests & Coverage
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups || uv sync --all-groups
      - run: uv run pytest --cov=. --cov-report=xml --cov-report=term-missing --ignore=attached_assets || echo "No tests found"
      - name: Upload coverage to Codecov
        if: success() && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
